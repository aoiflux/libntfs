name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The library parses disk images rather than touching the host file
        # system, so it should behave identically everywhere. Running all three
        # is what proves that rather than assuming it.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The module has no dependencies and no go.sum, so there is nothing to
          # cache and the cache step only warns that it cannot find one.
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # This also replays every fuzz seed and every crasher committed under
      # testdata/fuzz as an ordinary subtest, on all three platforms. That is the
      # part of fuzzing worth gating a push on: it is deterministic, it takes a
      # second, and it is what stops a fixed parser bug from coming back. Hunting
      # for new inputs is a search, not a test, and lives in fuzz.yml.
      - name: Test
        run: go test -race ./...

      # gofmt is deliberately not gated here. Most of the tree predates this
      # workflow and is stored with CRLF line endings, so gofmt reports every
      # such file as unformatted regardless of its actual formatting. Gating on
      # it would fail every run for a reason unrelated to the change under test.
      # Format new files locally before committing them.
